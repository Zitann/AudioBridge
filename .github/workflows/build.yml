name: Build A2DP Bridge DLL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DLL with MSVC
        shell: cmd
        run: |
          @echo off
          :: 用 vswhere 动态查找最新安装的 VS（要求包含 C++ 工具）
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            set "VSINSTALLDIR=%%i"
          )
          if not defined VSINSTALLDIR (
            echo ERROR: Visual Studio with C++ tools not found
            exit /b 1
          )
          echo Found VS at: %VSINSTALLDIR%
          call "%VSINSTALLDIR%\Common7\Tools\VsDevCmd.bat" -arch=x64

          :: 查找源文件
          if not exist a2dp_bridge.cpp (
            if exist a2dp-bridge\a2dp_bridge.cpp set "SRC=a2dp-bridge\a2dp_bridge.cpp"
          )
          if not defined SRC set "SRC=a2dp_bridge.cpp"

          cl.exe /nologo /std:c++20 /EHsc /O2 /W3 /LD "%SRC%" /link /OUT:a2dp_bridge.dll
          if errorlevel 1 exit /b 1
          if not exist a2dp_bridge.dll exit /b 1

          if not exist a2dp_bridge.h (
            if exist a2dp-bridge\a2dp_bridge.h copy /y a2dp-bridge\a2dp_bridge.h a2dp_bridge.h >nul
          )

      - name: Verify DLL exports
        shell: cmd
        run: |
          @echo off
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            set "VSINSTALLDIR=%%i"
          )
          call "%VSINSTALLDIR%\Common7\Tools\VsDevCmd.bat" -arch=x64 >nul
          dumpbin /EXPORTS a2dp_bridge.dll | findstr /C:"A2DP_Init" /C:"A2DP_Connect" /C:"A2DP_Shutdown"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2dp_bridge_dll
          if-no-files-found: error
          path: |
            a2dp_bridge.dll
            a2dp_bridge.h
