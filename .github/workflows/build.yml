name: Build A2DP Bridge DLL

on:
  workflow_dispatch: # 手动触发

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # windows-latest 预装了 VS2022 + Windows SDK。
      # 直接调用 VsDevCmd.bat 设置 MSVC 环境，不依赖第三方 action。
      # 编译命令：cl /LD 生成 a2dp_bridge.dll（C++/WinRT 头文件来自 SDK）。
      - name: Build DLL with MSVC
        shell: cmd
        run: |
          @echo off
          if exist "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" (
            call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          ) else (
            call "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\Tools\VsDevCmd.bat" -arch=x64
          )
          if not exist a2dp_bridge.cpp (
            if exist a2dp-bridge\a2dp_bridge.cpp set "SRC=a2dp-bridge\a2dp_bridge.cpp"
          )
          if not defined SRC set "SRC=a2dp_bridge.cpp"
          cl.exe /nologo /std:c++20 /EHsc /O2 /W3 /LD "%SRC%" /link /OUT:a2dp_bridge.dll
          if errorlevel 1 exit /b 1
          if not exist a2dp_bridge.dll exit /b 1
          if not exist a2dp_bridge.h (
            if exist a2dp-bridge\a2dp_bridge.h copy /y a2dp-bridge\a2dp_bridge.h a2dp_bridge.h >nul
          )

      # 验证 DLL 确实导出了 A2DP_* 符号，避免拿到一个"空" DLL
      - name: Verify DLL exports
        shell: cmd
        run: |
          @echo off
          if exist "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" (
            call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 >nul
          ) else (
            call "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\Tools\VsDevCmd.bat" -arch=x64 >nul
          )
          dumpbin /EXPORTS a2dp_bridge.dll | findstr /C:"A2DP_Init" /C:"A2DP_Connect" /C:"A2DP_Shutdown"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2dp_bridge_dll
          if-no-files-found: error
          path: |
            a2dp_bridge.dll
            a2dp_bridge.h
