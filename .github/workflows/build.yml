name: Build A2DP Bridge DLL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build DLL
        shell: cmd
        run: |
          @echo off
          if not exist a2dp_bridge.cpp (
            if exist a2dp-bridge\a2dp_bridge.cpp set "SRC=a2dp-bridge\a2dp_bridge.cpp"
          )
          if not defined SRC set "SRC=a2dp_bridge.cpp"
          cl.exe /nologo /std:c++20 /EHsc /O2 /W3 /LD "%SRC%" /link /OUT:a2dp_bridge.dll
          if errorlevel 1 exit /b 1
          if not exist a2dp_bridge.dll exit /b 1
          if not exist a2dp_bridge.h (
            if exist a2dp-bridge\a2dp_bridge.h copy /y a2dp-bridge\a2dp_bridge.h a2dp_bridge.h >nul
          )

      - name: Verify DLL exports
        shell: cmd
        run: |
          dumpbin /EXPORTS a2dp_bridge.dll | findstr /C:"A2DP_Init" /C:"A2DP_Connect" /C:"A2DP_Shutdown"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2dp_bridge_dll
          if-no-files-found: error
          path: |
            a2dp_bridge.dll
            a2dp_bridge.h
